name: Publish crates.io (disabled)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: publish-crates-io
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ false }}
    runs-on: macos-arm64
    steps:
      - name: Check out the release commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check release environment
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -eu
          test -n "${CARGO_REGISTRY_TOKEN:-}"
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          rustup show active-toolchain
          xcrun --sdk macosx --find clang++
          xcrun --sdk macosx --find metal
          test -f /opt/homebrew/opt/mlx/include/mlx/mlx.h
          test -f /opt/homebrew/opt/mlx/lib/libmlx.dylib
          test -f /opt/homebrew/opt/mlx/lib/mlx.metallib

      - name: Validate workspace
        env:
          MLX_PREFIX: /opt/homebrew/opt/mlx
        run: |
          set -eu
          cargo +nightly fmt --all -- --check
          cargo +nightly clippy --workspace --all-targets --all-features -- -D warnings
          cargo +nightly test --workspace --all-features
          cargo +nightly check --workspace --all-targets --all-features
          cargo +nightly rustdoc -p mirtal --all-features -- -D warnings

      - name: Publish unpublished workspace version
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          MLX_PREFIX: /opt/homebrew/opt/mlx
        shell: bash
        run: |
          set -euo pipefail

          release_version="$({ sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml || true; } | head -n 1)"
          if [[ -z "$release_version" ]]; then
            echo "Workspace release version is missing" >&2
            exit 1
          fi

          publish_if_missing() {
            local crate_name="$1"
            local endpoint="https://crates.io/api/v1/crates/${crate_name}/${release_version}"
            local user_agent="mirtal-release/${release_version} (https://github.com/mirmir-tech/mirtal)"
            local response

            response="$(curl \
              --silent \
              --show-error \
              --retry 5 \
              --retry-all-errors \
              --user-agent "$user_agent" \
              --output /dev/null \
              --write-out '%{http_code}' \
              "$endpoint")"

            case "$response" in
              200)
                echo "${crate_name} ${release_version} is already published"
                ;;
              404)
                cargo +nightly publish --locked --package "$crate_name"
                ;;
              *)
                echo "crates.io returned HTTP ${response} for ${crate_name} ${release_version}" >&2
                exit 1
                ;;
            esac
          }

          publish_if_missing mirtal-sys
          publish_if_missing mirtal-macros
          publish_if_missing mirtal
